name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'  # Every day at 06:00 UTC — includes live-selectors
  workflow_dispatch:

jobs:
  # ─── Fast unit + selector + export tests on every commit ───────────────────
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build all outputs
        run: npm run build

      - name: Install test dependencies
        run: npm ci
        working-directory: tests

      - name: Run unit tests
        run: npm run test:unit
        working-directory: tests

      - name: Run selector snapshot fixtures
        run: npm run test:selectors
        working-directory: tests

      - name: Run export tests
        run: npm run test:export
        working-directory: tests

  # ─── Puppeteer-based integration tests (separate job for parallelism) ──────
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build standalone bundle
        run: npm run build

      - name: Install test dependencies
        run: npm ci
        working-directory: tests

      - name: Ensure Chromium for Puppeteer
        run: npx puppeteer browsers install chrome
        working-directory: tests

      - name: Run integration tests (7 frameworks, mock HTTP transport)
        run: npm run test:integration
        working-directory: tests

  # ─── Live-site CSS drift detection (scheduled only) ────────────────────────
  live-selectors:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install test dependencies
        run: npm ci
        working-directory: tests

      - name: Ensure Chromium for Puppeteer
        run: npx puppeteer browsers install chrome
        working-directory: tests

      - name: Run live-site selector validation
        run: npm run test:live-selectors
        working-directory: tests
        env:
          TEST_LIVE: '1'
